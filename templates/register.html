{% extends 'base.html' %}

{% block title %}रजिस्टर - Krishi AI{% endblock %}

{% block extra_css %}
<style>
    .auth-page{
    position:relative;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;

    overflow:hidden;
    isolation:isolate;
}
.auth-page::before{
    content:"";
    position:absolute;
    inset:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    animation:loginSlider 48s infinite;

    transform:scale(1.05);

    z-index:-3;
}

.auth-page::after{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
rgba(3,7,18,.25),
rgba(3,7,18,.30)
);

    backdrop-filter:blur(2px);

    z-index:-2;
}
    
    .auth-card{

    position:relative;

    z-index:10;

    background:rgba(17,24,39,.52);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    border-radius:28px;

    width:100%;

    max-width:600px;

    padding:55px;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:0 35px 80px rgba(0,0,0,.55);

    text-align:center;

    animation:slideUp .5s ease-out;
}

    .auth-header {
        margin-bottom: 25px;
    }

    .auth-icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #10B981, #059669);
        color: white;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 15px;
        box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    .auth-title {
        font-family: 'Outfit', sans-serif;
        font-size: 28px;
        color: #ffffff !important;
        margin-bottom: 5px;
        font-weight: 800;
    }

    .auth-subtitle {
        color: #9CA3AF;
        font-size: 14.5px;
        line-height: 1.5;
    }

    .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
    }

    .form-row .form-group {
        flex: 1;
        margin-bottom: 0;
    }

    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-label {
        display: block;
        font-weight: 600;
        color: #E5E7EB;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .form-input-wrapper {
        position: relative;
    }

    .form-input-wrapper i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #9CA3AF;
        font-size: 16px;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px 12px 45px;
        background: rgba(3, 7, 18, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 15px;
        color: #ffffff;
        transition: all 0.3s;
        font-family: 'Inter', sans-serif;
    }

    .form-control:focus {
        border-color: #10B981;
        outline: none;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        background: rgba(3, 7, 18, 0.8);
    }

    .auth-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #10B981, #059669);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        margin-top: 10px;
        font-family: 'Outfit', sans-serif;
    }

    .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }

    .auth-footer {
        margin-top: 20px;
        font-size: 15px;
        color: #9CA3AF;
    }

    .auth-link {
        color: #34D399;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
    }

    .auth-link:hover {
        color: #10B981;
        text-decoration: underline;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes loginSlider{

0%,12.5%{
background-image:url("/static/login-bg/bg1.jpg");
}

12.5%,25%{
background-image:url("/static/login-bg/bg2.jpg");
}

25%,37.5%{
background-image:url("/static/login-bg/bg3.jpg");
}

37.5%,50%{
background-image:url("/static/login-bg/bg4.jpg");
}

50%,62.5%{
background-image:url("/static/login-bg/bg5.jpg");
}

62.5%,75%{
background-image:url("/static/login-bg/bg6.jpg");
}

75%,87.5%{
background-image:url("/static/login-bg/bg7.jpg");
}

87.5%,100%{
background-image:url("/static/login-bg/bg8.jpg");
}

}

    /* Mobile Responsive */
    @media (max-width: 500px) {
        .form-row {
            flex-direction: column;
            gap: 20px;
        }
        .auth-card{
         max-width:95%;
         padding:35px 22px;
}
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fa-solid fa-tractor"></i>
            </div>
            <h1 class="auth-title">किसान पंजीकरण</h1>
            <p class="auth-subtitle">मुफ्त में रजिस्टर करें और अपनी खेती को स्मार्ट बनाएं</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">पूरा नाम</label>
                <div class="form-input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="name" class="form-control" placeholder="अपना पूरा नाम दर्ज करें" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">मोबाइल नंबर</label>
                    <div class="form-input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" name="mobile_no" class="form-control" placeholder="10 अंकों का नंबर" pattern="[0-9]{10}" title="Please enter valid 10 digit mobile number" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">ईमेल (वैकल्पिक)</label>
                    <div class="form-input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" class="form-control" placeholder="अपना ईमेल दर्ज करें" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">पासवर्ड</label>
                <div class="form-input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" class="form-control" placeholder="एक मजबूत पासवर्ड बनाएं" required>
                </div>
            </div>

            <button type="submit" class="auth-btn">रजिस्टर करें <i class="fa-solid fa-check-circle" style="margin-left: 5px;"></i></button>
        </form>

        <div class="auth-footer">
            पहले से ही खाता है? <a href="{{ url_for('login') }}" class="auth-link">यहाँ लॉगिन करें</a>
        </div>
    </div>
</div>
{% endblock %}
